<ion-app>
  <ion-split-pane contentId="main">
    <ion-menu side="start" contentId="main">
      <ion-header>
        <ion-toolbar>
          <ion-title translate>menu</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list lines="none">
          <ion-menu-toggle auto-hide="false" *ngFor="let menuPoint of menuPoints">
            <ion-item [detail]="false" (click)="openMenuPoint(menuPoint)">
              <ion-label>
                {{menuPoint.name$ | async}}
              </ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
