<ng-container *ngIf="order$ | async as order">
  <ion-header>
    <ion-toolbar>
      <ion-title translate>{{order.name}}</ion-title>
      <ion-buttons slot="end">
        <ion-button (click)="close()">
          <ion-icon name="arrow-back"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <form [formGroup]="orderFormGroup" (ngSubmit)="onSubmit()" (keyup.enter)="onSubmit()">
      <ion-item>
        <ion-label translate>starts at</ion-label>
        <ion-datetime formControlName="starts"></ion-datetime>
      </ion-item>
      <ion-item>
        <ion-label translate>ends at</ion-label>
        <ion-datetime formControlName="ends"></ion-datetime>
      </ion-item>
      <ion-list>
        <ion-list-header lines="full">
          <ion-label translate>articles</ion-label>
        </ion-list-header>
        <ion-item *ngFor="let orderArticle of order.orderArticles">
          <ion-label class="name">{{orderArticle.article.name}}</ion-label>
          <ion-label class="name">{{orderArticle.article.unit}}</ion-label>
          <ion-checkbox></ion-checkbox>
        </ion-item>
      </ion-list>
      <ion-button expand="block" type="submit" [disabled]="orderFormGroup.invalid" translate>save</ion-button>
    </form>
  </ion-content>
</ng-container>
