<ng-container *ngIf="order$ | async as order; else loader">
  <form [formGroup]="orderFormGroup" (ngSubmit)="onSubmit(order)" (keyup.enter)="onSubmit(order)" class="order-form">
    <ion-header>
      <ion-toolbar>
        <ion-title translate>{{order.name}}</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="close()">
            <ion-icon name="arrow-back"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
      <ion-list>
        <ion-item>
          <ion-label translate>starts at</ion-label>
          <ion-datetime formControlName="starts"></ion-datetime>
        </ion-item>
        <ion-item>
          <ion-label translate>ends at</ion-label>
          <ion-datetime formControlName="ends" appValidationErrorsDisplay></ion-datetime>
        </ion-item>
        <ion-item>
          <ion-label translate>pickup</ion-label>
          <ion-datetime formControlName="pickup"></ion-datetime>
        </ion-item>
      </ion-list>
    </ion-header>
    <ion-content>
      <ion-list formGroupName="articles">
        <ion-list-header lines="full">
          <ion-label translate>articles</ion-label>
        </ion-list-header>
        <ion-item *ngFor="let article of order.supplier.articles">
          <ion-label class="name">{{article.name}}</ion-label>
          <ion-label class="name">{{article.unit}}</ion-label>
          <ion-checkbox [formControlName]="article.id"></ion-checkbox>
        </ion-item>
      </ion-list>
    </ion-content>
    <ion-footer>
      <ion-button expand="block" type="submit" [disabled]="orderFormGroup.invalid" translate>save</ion-button>
    </ion-footer>
  </form>
</ng-container>
<ng-template #loader>
  <ion-header>
    <ion-toolbar>
      <ion-title>
        <span translate>order</span>
      </ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-spinner class="centered-spinner"></ion-spinner>
  </ion-content>
</ng-template>
