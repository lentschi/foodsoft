<form *ngIf="loginFormGroup" [formGroup]="loginFormGroup" (ngSubmit)="onSubmit()">
  <ion-item>
    <ion-label>Username</ion-label>
    <ion-input formControlName="userName"></ion-input>
  </ion-item>
  <ion-item>
    <ion-label>Password</ion-label>
    <ion-input type="password" formControlName="password"></ion-input>
  </ion-item>
  <ion-button type="submit" [disabled]="!loginFormGroup?.valid">Login</ion-button>
</form>
